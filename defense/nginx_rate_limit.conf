# Exemplo de configuração de Rate Limiting e Proteção de Login Web (ex: DVWA)
# Arquivo: /etc/nginx/conf.d/dvwa_protect.conf

# 1. Definição da zona de limite de requisições por IP de origem
# 10m armazena ~160.000 IPs; taxa máxima de 5 requisições por minuto por IP
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

server {
    listen 80;
    server_name dvwa.local;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 2. Aplicação do Rate Limit estrito especificamente no formulário de login
    location = /vulnerabilities/brute/ {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429; # Retorna HTTP 429 Too Many Requests

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /login.php {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
