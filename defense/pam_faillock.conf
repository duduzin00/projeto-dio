# Exemplo de configuração de bloqueio de contas no Linux (PAM faillock)
# Arquivo: /etc/security/faillock.conf
# Mitigação contra Password Guessing e Password Spraying em nível de sistema operacional

# Número máximo de falhas consecutivas antes do bloqueio
deny = 5

# Tempo de bloqueio temporário da conta em segundos (ex: 900s = 15 minutos)
unlock_time = 900

# Janela de tempo de monitoramento das falhas em segundos
fail_interval = 900

# Se deve auditar tentativas mesmo para o usuário root (manter cautela em produção)
even_deny_root

# Registro de log detalhado das tentativas de autenticação
audit

# Explicação:
# Esta configuração faz com que, após 5 tentativas de senha incorreta para um usuário,
# a conta fique temporariamente suspensa por 15 minutos, inviabilizando ataques
# automatizados de força bruta contínuos.
